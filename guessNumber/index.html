<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number Game</title>
    <script src="./js/script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Guess the Number!</h1>
        <h2>Guess a number between 1 and 100 in seven attempts!</h2>
    </header>
    <br>
    <div id="main">
        Enter a guess:
        <input type="text" id="playerGuess" size="5">
        <button id="guessBtn">Guess</button> <br>
        <button id="resetBtn">Reset</button>
        <div id="feedback"></div>
        <div>Previous Guesses:
            <span id="guesses">
            </span>
        </div>

        <div id="scoreboard">
            Wins: <span id="wins">0</span> | Losses: <span id="losses">0</span>
        </div>
    </div>
</body>
</html>
