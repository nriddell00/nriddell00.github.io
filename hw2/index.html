<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW2</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
    <div>
        <h1>Slot Machine</h1>
        <p>Place bet and click the button to spin the slot machine!</p>
    </div>
    <div id="bank">
        Balance: <span id="balance">$1000</span>
    </div>
    <div id="bet">
        Bet Amount: <input type="number" id="betAmount" value="100" min="1" max="1000">
    </div>
    <div id="buttons">
        <button id="spinButton">SPIN</button>
        <button id="resetButton">RESET</button>
    </div>

    <div id="icons">
        <div class="icon" id="icon1">🍒</div>
        <div class="icon" id="icon2">🍋</div>
        <div class="icon" id="icon3">🍊</div>
    </div>

    <div id="message">Ready to play!</div>
    </div>

    
</body>
</html>
